# One-click deploy on render.com (free plan): New + > Blueprint > pick this repo.
services:
  - type: web
    name: street-spotter
    runtime: node
    rootDir: street-spotter
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: GOOGLE_MAPS_API_KEY
        sync: false
